<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="156" viewBox="0 0 1000 156" role="img" aria-label="Known limitations stated up front: ARIA latency, critic scope, TriMind retrieval"><title>Known limitations stated up front: ARIA latency, critic scope, TriMind retrieval</title><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#141B38"/></linearGradient></defs><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0333;0.1833;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 10;0 0;0 0" keyTimes="0;0.0333;0.1833;1" dur="6s" begin="0s" fill="freeze"/><rect x="0" y="0" width="320" height="156" rx="16" fill="url(#t)" stroke="#FBBF24" stroke-opacity="0.35" stroke-dasharray="5 4"/><text x="24" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8EBF8">8–15 min per full ARIA run</text><text x="24" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">A sequential multi-stage LLM pipeline,</text><text x="24" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">plus a possible critique retry. Dev mode</text><text x="24" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">trades coverage for speed.</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0667;0.2167;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 10;0 0;0 0" keyTimes="0;0.0667;0.2167;1" dur="6s" begin="0s" fill="freeze"/><rect x="340" y="0" width="320" height="156" rx="16" fill="url(#t)" stroke="#F472B6" stroke-opacity="0.35" stroke-dasharray="5 4"/><text x="364" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8EBF8">Critic ≠ fact-checker</text><text x="364" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">It scores consistency and coverage against</text><text x="364" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">retrieved papers; a confident report can</text><text x="364" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">still contain an LLM-introduced error.</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1000;0.2500;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 10;0 10;0 0;0 0" keyTimes="0;0.1000;0.2500;1" dur="6s" begin="0s" fill="freeze"/><rect x="680" y="0" width="320" height="156" rx="16" fill="url(#t)" stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="5 4"/><text x="704" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E8EBF8">Dense retrieval only, for now</text><text x="704" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">TriMind ranks by embeddings, MMR and</text><text x="704" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">custom boosts. Hybrid BM25 is planned;</text><text x="704" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">multimodal RAG is in progress.</text></g></svg>