<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364" role="img" aria-label="Claims and how each was checked: FL-XAI, SHAP consistency, TriMind grounding, ARIA summary quality"><title>Claims and how each was checked: FL-XAI, SHAP consistency, TriMind grounding, ARIA summary quality</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#141B38"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern></defs><rect width="1000" height="364" rx="20" fill="url(#bg)"/><rect width="1000" height="364" rx="20" fill="url(#grid)"/><text x="28" y="38" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.4" fill="#8D96BC">CLAIM</text><text x="330" y="38" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.4" fill="#8D96BC">HOW IT WAS CHECKED</text><text x="720" y="38" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.4" fill="#8D96BC">RESULT</text><line x1="28" y1="52" x2="972" y2="52" stroke="#fff" stroke-opacity="0.12"/><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0333;0.1833;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.0333;0.1833;1" dur="6s" begin="0s" fill="freeze"/><rect x="28" y="74" width="3" height="44" rx="1.5" fill="#22D3EE"/><text x="44" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">Adaptive aggregation</text><text x="44" y="115" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">beats FedAvg</text><text x="330" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">Performance-aware client weighting + RF tree fusion;</text><text x="330" y="115" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">bootstrap CIs and Wilcoxon signed-rank validation</text><text x="720" y="97" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#22D3EE">−3.45% RMSE</text><text x="720" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8D96BC">vs FedAvg · RMSE 4.51 · R² 0.8162</text><line x1="28" y1="128" x2="972" y2="128" stroke="#fff" stroke-opacity="0.06"/></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0750;0.2250;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.0750;0.2250;1" dur="6s" begin="0s" fill="freeze"/><rect x="28" y="140" width="3" height="44" rx="1.5" fill="#F472B6"/><text x="44" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">SHAP explanations agree</text><text x="44" y="181" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">across clients</text><text x="330" y="171" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">Kendall τ on per-client SHAP feature rankings</text><text x="720" y="163" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#F472B6">τ = 0.6105</text><text x="720" y="182" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8D96BC">feature-ranking consistency</text><line x1="28" y1="194" x2="972" y2="194" stroke="#fff" stroke-opacity="0.06"/></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1167;0.2667;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.1167;0.2667;1" dur="6s" begin="0s" fill="freeze"/><rect x="28" y="206" width="3" height="44" rx="1.5" fill="#34D399"/><text x="44" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">RAG answers are grounded</text><text x="330" y="228" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">Per-query grounding + confidence score;</text><text x="330" y="247" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">weakly-grounded retrievals get flagged</text><text x="720" y="229" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#34D399">0.34 – 0.95</text><text x="720" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8D96BC">score spread across queries</text><line x1="28" y1="260" x2="972" y2="260" stroke="#fff" stroke-opacity="0.06"/></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1583;0.3083;1" dur="6s" begin="0s" fill="freeze"/><animateTransform attributeName="transform" type="translate" additive="sum" values="0 8;0 8;0 0;0 0" keyTimes="0;0.1583;0.3083;1" dur="6s" begin="0s" fill="freeze"/><rect x="28" y="272" width="3" height="44" rx="1.5" fill="#8B7CFF"/><text x="44" y="294" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">ARIA's summaries</text><text x="44" y="313" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E8EBF8">hold up</text><text x="330" y="294" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">Quality-scored on an evaluation run of 5 papers;</text><text x="330" y="313" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#8D96BC">critic separately gates synthesis, bounded retries</text><text x="720" y="295" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#8B7CFF">8.4 / 10</text><text x="720" y="314" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8D96BC">average summary quality</text></g><text x="28" y="350" font-family="'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#8D96BC">Numbers as reported in the evaluation runs of each project. Details live in the repositories.</text></svg>