<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a594ff"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6dfa;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#7c6dfa;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#2dd4bf;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#7c6dfa" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="150" y1="0" x2="150" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="160"/>
    <line x1="450" y1="0" x2="450" y2="160"/>
    <line x1="600" y1="0" x2="600" y2="160"/>
    <line x1="750" y1="0" x2="750" y2="160"/>
  </g>

  <!-- Ambient glow blobs -->
  <ellipse cx="180" cy="80" rx="120" ry="70" fill="#7c6dfa" opacity="0.06" filter="url(#softglow)"/>
  <ellipse cx="720" cy="80" rx="100" ry="60" fill="#2dd4bf" opacity="0.05" filter="url(#softglow)"/>

  <!-- Animated particles -->
  <circle cx="80" cy="40" r="1.5" fill="#a594ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;35;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="1" fill="#2dd4bf" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;115;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="1.5" fill="#a594ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="130" r="1" fill="#2dd4bf" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;125;130" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="50" r="1.5" fill="#a594ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="140" r="1" fill="#7c6dfa" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="90" r="1.2" fill="#2dd4bf" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="100" r="1" fill="#a594ff" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated scanning line -->
  <rect x="0" y="0" width="900" height="1" fill="url(#lineGrad)" opacity="0.5">
    <animate attributeName="y" values="0;160;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accent dots -->
  <circle cx="20" cy="20" r="2" fill="#7c6dfa" opacity="0.5"/>
  <circle cx="880" cy="20" r="2" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="20" cy="140" r="2" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="880" cy="140" r="2" fill="#7c6dfa" opacity="0.5"/>

  <!-- Corner brackets -->
  <path d="M 14 30 L 14 14 L 30 14" stroke="#7c6dfa" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 870 14 L 886 14 L 886 30" stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 14 130 L 14 146 L 30 146" stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 870 146 L 886 146 L 886 130" stroke="#7c6dfa" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Main name - with fade-in animation -->
  <text x="450" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700"
        fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="-1">
    Bhoomika Goel
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400"
        fill="#9898b0" text-anchor="middle" letter-spacing="2">
    AI / ML ENGINEER
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze"/>
  </text>

  <!-- Thin accent line under name -->
  <line x1="310" y1="108" x2="590" y2="108" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.6">
    <animate attributeName="x1" values="450;310" dur="1s" fill="freeze"/>
    <animate attributeName="x2" values="450;590" dur="1s" fill="freeze"/>
  </line>

  <!-- Tag line -->
  <text x="450" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="300"
        fill="#5a5a70" text-anchor="middle" letter-spacing="0.5">
    Reliable · Interpretable · Real-World
    <animate attributeName="opacity" values="0;0;0;1" dur="2.2s" fill="freeze"/>
  </text>

</svg>